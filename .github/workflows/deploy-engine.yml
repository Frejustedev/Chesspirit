name: Déploiement du service échecs

# Inactif tant que les secrets ne sont pas configurés (voir docs/MISE_EN_LIGNE.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/chess-engine/**"]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Vérifier la configuration
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN absent : déploiement ignoré." ; echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.enabled == 'true'
      - name: Déployer sur Fly.io
        if: steps.check.outputs.enabled == 'true'
        working-directory: services/chess-engine
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
