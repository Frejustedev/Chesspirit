name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, types, tests unitaires, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  python:
    name: Service échecs — ruff, pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/chess-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  database:
    name: Base — migrations, RLS, parcours Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pile Supabase locale (Postgres, PostgREST, GoTrue)
        run: bash scripts/local-stack.sh start
      - run: pnpm test:rls
      - run: pnpm seed
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Parcours critiques (mobile 390 px)
        run: pnpm --filter web exec playwright test --project=mobile
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
