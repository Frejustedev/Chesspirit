# Configuration Fly.io (région la plus proche du Bénin disponible : à choisir à la création, voir docs/MISE_EN_LIGNE.md).
app = "chesspirit-engine"
primary_region = "cdg"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
