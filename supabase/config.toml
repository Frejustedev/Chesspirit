# Configuration de la CLI Supabase (`supabase start` avec Docker).
# Sans Docker, `pnpm dev` lance une pile équivalente (scripts/local-stack.sh), mêmes ports et clés.
project_id = "chesspirit"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false # données : `pnpm seed`

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
sms_sent = 30
token_verifications = 60

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "5s"

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "5s"
# En local, codes de test fixes (aucun SMS envoyé). En production : Twilio (voir docs/MISE_EN_LIGNE.md).
[auth.sms.test_otp]
22990000001 = "123456"
22990000005 = "123456"
22990000009 = "123456"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
